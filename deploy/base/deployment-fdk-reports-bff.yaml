---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: fdk-reports-bff
  name: fdk-reports-bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fdk-reports-bff
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: fdk-reports-bff
    spec:
      containers:
      - env:
        - name: DATASET_QUERY_CACHE_URL
          valueFrom:
            secretKeyRef:
              name: fdk-dataset-rdf-diff-store
              key: QUERY_CACHE_URL
        - name: CONCEPT_QUERY_CACHE_URL
          valueFrom:
            secretKeyRef:
              name: fdk-concept-rdf-diff-store
              key: QUERY_CACHE_URL
        - name: DATASERVICE_QUERY_CACHE_URL
          valueFrom:
            secretKeyRef:
              name: fdk-data-service-rdf-diff-store
              key: QUERY_CACHE_URL
        - name: CONCEPT_HARVESTER_URL
          valueFrom:
            secretKeyRef:
              name: commonurl
              key: FDK_CONCEPT_HARVESTER_URI
        - name: DATASET_HARVESTER_URL
          valueFrom:
            secretKeyRef:
              name: commonurl
              key: FDK_DATASET_HARVESTER_URI
        - name: DATASERVICE_HARVESTER_URL
          valueFrom:
            secretKeyRef:
              name: commonurl
              key: FDK_DATASERVICE_HARVESTER_URI
        - name: INFORMATIONMODELS_HARVESTER_URL
          valueFrom:
            secretKeyRef:
              name: commonurl
              key: FDK_FULLTEXT_SEARCH_BASE_URI
        - name: FDK_REFERENCE_DATA_URL
          valueFrom:
            secretKeyRef:
              name: commonurl
              key: FDK_REFERENCE_DATA_BASE_URI
        - name: ELASTIC_HOST
          valueFrom:
            secretKeyRef:
              name: fdk-reports-bff
              key: FDK_REPORTS_STORE_HOST
        - name: ELASTIC_PORT
          valueFrom:
            secretKeyRef:
              name: fdk-reports-bff
              key: FDK_REPORTS_STORE_PORT
        - name: FDK_BASE
          valueFrom:
            secretKeyRef:
              name: commonurl
              key: FDK_BASE_URI
        - name: SPARQL_BASE
          valueFrom:
            secretKeyRef:
              name: commonurl
              key: FDK_SPARQL_SERVICE_QUERY_URI
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: common
              key: FDK_REPORTS_BFF_API_KEY
        - name: CORS_ORIGIN_PATTERNS
          valueFrom:
            secretKeyRef:
              name: fdk-reports-bff
              key: CORS_ORIGIN_PATTERNS
        name: fdk-reports-bff
        image: fdk-reports-bff
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /ping
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 30
          successThreshold: 1
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 30
          successThreshold: 1
          failureThreshold: 5
        resources:
          requests:
            cpu: 100m
            memory: 750Mi
          limits:
            memory: 750Mi
      restartPolicy: Always
